[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolyse"
version = "2.0.0"
description = "Prescriptive automated EDA - data health score, ranked findings with fixes, and interactive reports in 2 lines of code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sanyam Chaudhary" }]
requires-python = ">=3.9"
keywords = ["eda", "data-science", "data-quality", "pandas", "autoeda"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "plotly>=5.10",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
ai = ["google-generativeai>=0.4"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sanyamChaudhary27/Autolyse"

[tool.setuptools.packages.find]
include = ["autolyse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
